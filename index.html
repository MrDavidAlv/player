<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ncs-player</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e1013'/%3E%3Cpath d='M12 9v14l11-7z' fill='%2338c2ff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="shell">

    <!-- Barra superior -->
    <header class="topbar">
      <div class="brand">
        <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="prompt"><span class="who">mrdavidalv@axioma</span><span class="sep">:</span><span class="path" id="src-path">~/music/ncs</span></span>
        <span class="sep">$</span>
        <span class="cmd">ncs-player</span>
      </div>
      <div class="topbar-meta">
        <span><b id="track-count">0</b> pistas</span>
        <span class="divider">|</span>
        <span id="total-time">--</span>
      </div>
    </header>

    <main class="layout">

      <!-- Reproductor -->
      <section class="panel deck" aria-label="Reproductor">
        <div class="panel-head">
          <span>// now_playing</span>
          <span id="status" class="status" data-state="idle" role="status" aria-live="polite">idle</span>
        </div>

        <div class="now">
          <div class="now-index" id="now-index">00 / 00</div>
          <h1 class="now-title" id="now-title">Selecciona una pista</h1>
          <p class="now-artist" id="now-artist">—</p>
          <p class="now-meta" id="now-meta"></p>
        </div>

        <div class="viz-wrap">
          <canvas id="viz" class="viz" aria-hidden="true" title="Clic para cambiar la vista (V)"></canvas>
          <div class="viz-foot">
            <span id="viz-readout">rms -- · pico --</span>
            <button id="viz-mode" class="viz-mode" title="Cambiar la vista (V)">scan</button>
          </div>
        </div>

        <div class="timeline">
          <span id="time-current" class="time">00:00</span>
          <input type="range" id="seek" class="range" min="0" max="1000" value="0" step="1" aria-label="Posición de la pista">
          <span id="time-total" class="time">00:00</span>
        </div>

        <div class="controls">
          <button id="btn-shuffle" class="btn btn-text" title="Aleatorio (S)" aria-pressed="false">SHF</button>

          <button id="btn-prev" class="btn" title="Anterior (P)" aria-label="Anterior">
            <svg viewBox="0 0 24 24">
              <path d="M6 5h2v14H6zM20 5v14L9 12z" />
            </svg>
          </button>

          <button id="btn-play" class="btn btn-main" title="Reproducir / Pausa (Espacio)" aria-label="Reproducir">
            <svg class="ico-play" viewBox="0 0 24 24">
              <path d="M7 4v16l13-8z" />
            </svg>
            <svg class="ico-pause" viewBox="0 0 24 24">
              <path d="M6 4h4v16H6zM14 4h4v16h-4z" />
            </svg>
          </button>

          <button id="btn-next" class="btn" title="Siguiente (N)" aria-label="Siguiente">
            <svg viewBox="0 0 24 24">
              <path d="M16 5h2v14h-2zM4 5v14l11-7z" />
            </svg>
          </button>

          <button id="btn-repeat" class="btn btn-text" title="Repetir (R)" aria-pressed="false">RPT</button>
        </div>

        <div class="volume">
          <label for="volume">vol</label>
          <input type="range" id="volume" class="range" min="0" max="100" value="80" aria-label="Volumen">
          <span id="vol-value" class="time">80</span>
        </div>

      </section>

      <!-- Playlist -->
      <section class="panel library" id="library" aria-label="Lista de reproducción">
        <div class="panel-head">
          <span>// playlist</span>
          <div class="sources" aria-label="Fuente">
            <button id="src-ncs" class="src-btn" aria-pressed="true" title="Catálogo NCS (online)">ncs</button>
            <button id="src-local" class="src-btn" aria-pressed="false" hidden></button>
            <button id="btn-open" class="src-btn src-open" title="Cargar una carpeta de música de tu equipo (O). También puedes arrastrarla aquí." aria-label="Cargar música">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/><path d="M12 16v-6M9 12.5l3-3 3 3"/></svg>
              <span>cargar música</span>
            </button>
          </div>
        </div>

        <div class="search">
          <span class="search-label">grep</span>
          <input id="filter" type="search" placeholder="artista, título o carpeta…" autocomplete="off" spellcheck="false" aria-label="Filtrar pistas">
          <span id="visible-count" class="muted"></span>
          <kbd>/</kbd>
        </div>

        <p id="notice" class="notice" role="status" hidden></p>

        <ol id="playlist" class="playlist"></ol>
      </section>

    </main>

    <footer class="footer">
      <span>audio: <a href="https://archive.org/details/274_Song_NCS_ultimate_mix" target="_blank" rel="noopener noreferrer">archive.org / NCS</a></span>
      <span class="divider">·</span>
      <span>música: NoCopyrightSounds</span>
      <span class="divider">·</span>
      <span class="social">
        <a href="https://github.com/MrDavidAlv" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
        <a href="https://www.linkedin.com/in/mrdavidalv/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" title="LinkedIn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>
        </a>
      </span>
    </footer>
  </div>

  <input type="file" id="picker" webkitdirectory multiple hidden>
  <audio id="audio" preload="none" crossorigin="anonymous"></audio>
  <script src="script.js"></script>
</body>

</html>
